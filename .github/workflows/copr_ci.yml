name: Check Update and Build Copr RPM

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Zorlanacak Sürüm (Örn: 2026.9.5 veya 2026.9.8)'
        required: false
        type: string

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl rpm squashfs-tools p7zip-full binutils python3-pip
          sudo pip3 install --break-system-packages copr-cli 2>/dev/null || sudo pip3 install copr-cli

      - name: Node.js 24 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Copr CLI Yapılandır
        run: |
          mkdir -p ~/.config
          cat << EOF > ~/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = universish
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr

      - name: Sürüm ve Varlık Kontrolü
        id: check
        run: |
          FORCE_VER="${{ github.event.inputs.force_version }}"
          REPO="openclaw/openclaw"

          if [ -n "$FORCE_VER" ]; then
            RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/tags/v${FORCE_VER}" 2>/dev/null || curl -fsSL "https://api.github.com/repos/${REPO}/releases/tags/${FORCE_VER}" 2>/dev/null || echo "{}")
            VERSION="$FORCE_VER"
          else
            RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest")
            VERSION=$(echo "$RELEASE_JSON" | jq -r .tag_name | sed 's/^v//')
          fi

          echo "Hedef Sürüm: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Varlık tespiti (AppImage > Deb > Tarball > npm)
          APPIMAGE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test(".*(linux|x86_64|amd64).*\\.AppImage$"; "i")) | .browser_download_url' | head -n 1)
          DEB_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test(".*(amd64|x86_64).*\\.deb$"; "i")) | .browser_download_url' | head -n 1)
          TAR_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test(".*(linux|x86_64|amd64).*\\.tar\\.(gz|xz)$"; "i")) | .browser_download_url' | head -n 1)

          if [ -n "$APPIMAGE_URL" ] && [ "$APPIMAGE_URL" != "null" ]; then
            echo "download_url=$APPIMAGE_URL" >> $GITHUB_OUTPUT
            echo "pkg_type=appimage" >> $GITHUB_OUTPUT
          elif [ -n "$DEB_URL" ] && [ "$DEB_URL" != "null" ]; then
            echo "download_url=$DEB_URL" >> $GITHUB_OUTPUT
            echo "pkg_type=deb" >> $GITHUB_OUTPUT
          elif [ -n "$TAR_URL" ] && [ "$TAR_URL" != "null" ]; then
            echo "download_url=$TAR_URL" >> $GITHUB_OUTPUT
            echo "pkg_type=tarball" >> $GITHUB_OUTPUT
          else
            echo "İkili dosya bulunamadı, npm fallback kullanılacak."
            echo "pkg_type=npm" >> $GITHUB_OUTPUT
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Paketi Çıkar, Demetle ve Arşivle
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          PKG_TYPE="${{ steps.check.outputs.pkg_type }}"
          URL="${{ steps.check.outputs.download_url }}"

          mkdir -p workdir app_extracted bundle/app
          cd workdir

          if [ "$PKG_TYPE" = "appimage" ]; then
            echo ".AppImage açılıyor: $URL"
            curl -fsSL -o package.AppImage "$URL"
            unsquashfs -d ../app_extracted package.AppImage || 7z x package.AppImage -o../app_extracted/ > /dev/null
            cd ../app_extracted
            rm -f .DirIcon 2>/dev/null || true
            cp -a * ../bundle/app/
          elif [ "$PKG_TYPE" = "deb" ]; then
            echo ".deb paketi açılıyor: $URL"
            curl -fsSL -o package.deb "$URL"
            ar x package.deb
            tar -xf data.tar.* -C ../app_extracted/
            cd ../app_extracted
            OPT_DIR=$(find opt -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
            [ -n "$OPT_DIR" ] && cp -a "$OPT_DIR"/* ../bundle/app/ || cp -a * ../bundle/app/
          elif [ "$PKG_TYPE" = "tarball" ]; then
            echo "Tarball açılıyor: $URL"
            curl -fsSL -o package.tar.gz "$URL"
            tar -xf package.tar.gz -C ../app_extracted/
            cd ../app_extracted
            cp -a * ../bundle/app/
          elif [ "$PKG_TYPE" = "npm" ]; then
            echo "npm CLI demetleniyor..."
            npm install -g --prefix "$GITHUB_WORKSPACE/bundle/app" --omit=dev --no-audit --no-fund --ignore-engines "openclaw@${VERSION}"
            cd "$GITHUB_WORKSPACE/bundle/app"
            [ -f bin/openclaw ] && ln -sf bin/openclaw openclaw
          fi

          # HD Simge Güvencesi (Paket içinde yoksa resmi kaynaklardan indir)
          ICON_FOUND=$(find "$GITHUB_WORKSPACE/bundle/app" -maxdepth 3 -type f \( -iname "*openclaw*.png" -o -iname "*OpenClaw*.png" \) 2>/dev/null | head -n 1)
          if [ -z "$ICON_FOUND" ]; then
            echo "Resmi HD simge indiriliyor..."
            curl -fsSL -o "$GITHUB_WORKSPACE/bundle/app/openclaw.png" "https://raw.githubusercontent.com/openclaw/openclaw/main/assets/icon.png" 2>/dev/null || \
            curl -fsSL -o "$GITHUB_WORKSPACE/bundle/app/openclaw.png" "https://raw.githubusercontent.com/openclaw/openclaw/main/docs/public/favicon.png" 2>/dev/null || true
          else
            cp -a "$ICON_FOUND" "$GITHUB_WORKSPACE/bundle/app/openclaw.png"
          fi

          cd "$GITHUB_WORKSPACE"
          find bundle/app/ -type f \( -name "AppRun*" -o -name "*openclaw*" -o -name "*OpenClaw*" \) -exec chmod +x {} + 2>/dev/null || true
          mv bundle "openclaw-${VERSION}-x86_64"
          tar -czf "openclaw-${VERSION}-x86_64.tar.gz" "openclaw-${VERSION}-x86_64"
          rm -rf workdir app_extracted "openclaw-${VERSION}-x86_64"

      - name: SRPM Oluştur ve Copr'a Gönder
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          RELEASE="${{ github.run_number }}"

          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mv "openclaw-${VERSION}-x86_64.tar.gz" rpmbuild/SOURCES/
          cp specs/openclaw.spec rpmbuild/SPECS/openclaw.spec

          # Makroları spec dosyasına doğrudan işle (Copr Mock unexpanded macro hatasını engeller)
          sed -i "s/%{_version}/${VERSION}/g" rpmbuild/SPECS/openclaw.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw.spec

          echo "Oluşturuluyor: openclaw-${VERSION}-${RELEASE}"

          rpmbuild -bs \
            --define "_topdir $PWD/rpmbuild" \
            rpmbuild/SPECS/openclaw.spec

          SRPM_FILE=$(ls rpmbuild/SRPMS/openclaw-*.src.rpm)
          copr-cli --config "$HOME/.config/copr" build --nowait "universish/OpenClaw.." "$SRPM_FILE"

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl rpm squashfs-tools p7zip-full binutils pipx
          pipx install copr-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
