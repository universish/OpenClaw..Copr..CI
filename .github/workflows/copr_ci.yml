name: Check Update and Build Copr RPM

on:
  schedule:
    # OpenClaw merkezi (ABD Pasifik Saati - PT) öğle arası (~12:30) ve iş çıkışı (~17:30)
    - cron: '30 19 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Zorlanacak Sürüm (Örn: 2026.9.8 - Boş bırakılırsa sadece yeni sürüm kontrolü yapar)'
        required: false
        type: string

# 3. aşamada latest-version.txt dosyasını güncelleyip pushlayabilmek için yazma izni
permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. AŞAMA: GÜNCEL SÜRÜMÜN YAYINLANIP YAYINLANMADIĞINI KONTROL ET
  # =========================================================================
  check_update:
    name: 1. Yeni Sürüm Kontrolü
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      cli_version: ${{ steps.check.outputs.cli_version }}
      desktop_version: ${{ steps.check.outputs.desktop_version }}
      combined_version: ${{ steps.check.outputs.combined_version }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js 24 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sürümleri Kontrol Et ve Karşılaştır
        id: check
        run: |
          FORCE_VER="${{ github.event.inputs.force_version }}"
          REPO="openclaw/openclaw"
          
          RELEASES_JSON=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases")
          
          if [ -n "$FORCE_VER" ]; then
            CLI_VERSION="$FORCE_VER"
            DESKTOP_VERSION="$FORCE_VER"
          else
            # Yalnızca içinde AppImage veya deb varlığı bulunan releases etiketlerini filtrele
            DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.(AppImage|deb)$"; "i")))] | .[0]')
            DESKTOP_VERSION=$(echo "$DESKTOP_RELEASE" | jq -r .tag_name | sed 's/^v//')
            
            # Yalnızca içinde tarball varlığı bulunan releases etiketlerini filtrele
            CLI_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.tar\\.(gz|xz)$"; "i")))] | .[0]')
            CLI_VERSION=$(echo "$CLI_RELEASE" | jq -r .tag_name | sed 's/^v//')
            
            # Upstream tarball yayınlamadıysa NPM üzerinden CLI sürümünü doğrula
            if [ "$CLI_VERSION" == "null" ] || [ -z "$CLI_VERSION" ]; then
              CLI_VERSION=$(npm view openclaw version 2>/dev/null)
            fi
          fi

          echo "Tespit Edilen CLI Sürümü: $CLI_VERSION"
          echo "Tespit Edilen Desktop Sürümü: $DESKTOP_VERSION"

          # Depodaki mevcut sürümü oku (latest-version.txt)
          CURRENT_VER=""
          if [ -f "latest-version.txt" ]; then
            CURRENT_VER=$(head -n 1 latest-version.txt | tr -d '[:space:]')
          fi
          echo "Depodaki Kayıtlı Sürüm: '$CURRENT_VER'"

          # Hem CLI hem Desktop sürüm değişimlerini yakalamak için kontrol değeri
          # Eğer ikisi aynıysa tek sürüm (Örn: 2026.9.8), farklıysa birleşik veya öncelikli kontrol
          if [ "$CLI_VERSION" == "$DESKTOP_VERSION" ] || [ "$DESKTOP_VERSION" == "null" ] || [ -z "$DESKTOP_VERSION" ]; then
            TARGET_STATE="$CLI_VERSION"
          else
            TARGET_STATE="cli:${CLI_VERSION}_desk:${DESKTOP_VERSION}"
          fi

          # Yeni sürüm kontrolü
          if [ -n "$FORCE_VER" ]; then
            echo "Manuel sürüm zorlandı ($FORCE_VER). Paketleme aşamasına geçiliyor..."
            HAS_UPDATE="true"
          elif [ "$TARGET_STATE" != "$CURRENT_VER" ] && [ "$CLI_VERSION" != "$CURRENT_VER" ]; then
            echo "Yeni güncelleme tespit edildi! ($CURRENT_VER -> $TARGET_STATE)"
            HAS_UPDATE="true"
          else
            echo "Yeni bir güncelleme yok. Mevcut sürüm ($CURRENT_VER) güncel. İş akışı sonlandırılıyor."
            HAS_UPDATE="false"
          fi

          echo "has_update=$HAS_UPDATE" >> $GITHUB_OUTPUT
          echo "cli_version=$CLI_VERSION" >> $GITHUB_OUTPUT
          echo "desktop_version=$DESKTOP_VERSION" >> $GITHUB_OUTPUT
          echo "combined_version=$TARGET_STATE" >> $GITHUB_OUTPUT

  # =========================================================================
  # 2. AŞAMA: İNDİR, AÇ, SPEC İLE YENİDEN PAKETLE VE COPR'A GÖNDER
  # =========================================================================
  build_and_publish:
    name: 2. Paketleme ve Copr Yayınlama
    needs: check_update
    if: needs.check_update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js 24 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl rpm squashfs-tools p7zip-full binutils python3-pip
          sudo pip3 install --break-system-packages copr-cli 2>/dev/null || sudo pip3 install copr-cli

      - name: Copr CLI Yapılandır
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr
          if [ ! -s ~/.config/copr ] || ! grep -q "token" ~/.config/copr; then
            echo "HATA: COPR_CONFIG secret'ı boş veya eksik!" >&2
            exit 1
          fi

      - name: Kaynak Paketleri İndir ve Hazırla
        run: |
          CLI_VERSION="${{ needs.check_update.outputs.cli_version }}"
          DESKTOP_VERSION="${{ needs.check_update.outputs.desktop_version }}"
          FORCE_VER="${{ github.event.inputs.force_version }}"
          REPO="openclaw/openclaw"

          RELEASES_JSON=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases")

          if [ -n "$FORCE_VER" ]; then
            DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c --arg v "v$FORCE_VER" '.[] | select(.tag_name == $v)' | head -n 1)
            CLI_RELEASE="$DESKTOP_RELEASE"
          else
            DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.(AppImage|deb)$"; "i")))] | .[0]')
            CLI_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.tar\\.(gz|xz)$"; "i")))] | .[0]')
          fi

          APPIMAGE_URL=$(echo "$DESKTOP_RELEASE" | jq -r '.assets[]? | select(.name | test("\\.AppImage$"; "i")) | .browser_download_url' | head -n 1)
          DEB_URL=$(echo "$DESKTOP_RELEASE" | jq -r '.assets[]? | select(.name | test("\\.deb$"; "i")) | .browser_download_url' | head -n 1)
          TAR_URL=$(echo "$CLI_RELEASE" | jq -r '.assets[]? | select(.name | test("\\.tar\\.(gz|xz)$"; "i")) | .browser_download_url' | head -n 1)

          # --- 1. DESKTOP HAZIRLIĞI ---
          mkdir -p workdir_desktop bundle_desktop/app app_extracted
          cd workdir_desktop
          if [ -n "$APPIMAGE_URL" ] && [ "$APPIMAGE_URL" != "null" ]; then
            echo "Desktop AppImage indiriliyor: $APPIMAGE_URL"
            curl -fsSL -o package.AppImage "$APPIMAGE_URL"
            chmod +x package.AppImage
            ./package.AppImage --appimage-extract
            cp -a squashfs-root/* ../bundle_desktop/app/
          elif [ -n "$DEB_URL" ] && [ "$DEB_URL" != "null" ]; then
            echo "Desktop deb indiriliyor: $DEB_URL"
            curl -fsSL -o package.deb "$DEB_URL"
            ar x package.deb
            tar -xf data.tar.* -C ../app_extracted/
            OPT_DIR=$(find ../app_extracted/opt -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
            [ -n "$OPT_DIR" ] && cp -a "$OPT_DIR"/* ../bundle_desktop/app/ || cp -a ../app_extracted/* ../bundle_desktop/app/
          fi
          cd ..

          # İkon garantisi
          ICON_FOUND=$(find bundle_desktop/app/ -maxdepth 3 -type f \( -iname "*openclaw*.png" -o -iname "*OpenClaw*.png" \) 2>/dev/null | head -n 1)
          if [ -z "$ICON_FOUND" ]; then
            if [ -f "icon/256.png" ]; then
              cp -a icon/256.png bundle_desktop/app/openclaw.png
            else
              curl -fsSL -o bundle_desktop/app/openclaw.png "https://raw.githubusercontent.com/openclaw/openclaw/main/assets/icon.png" 2>/dev/null || true
            fi
          else
            cp -a "$ICON_FOUND" bundle_desktop/app/openclaw.png
          fi

          mv bundle_desktop "openclaw-desktop-${DESKTOP_VERSION}-x86_64"
          tar -czf "openclaw-desktop-${DESKTOP_VERSION}-x86_64.tar.gz" "openclaw-desktop-${DESKTOP_VERSION}-x86_64"
          rm -rf workdir_desktop app_extracted "openclaw-desktop-${DESKTOP_VERSION}-x86_64"

          # --- 2. CLI HAZIRLIĞI ---
          mkdir -p workdir_cli bundle_cli/app
          cd workdir_cli
          if [ -n "$TAR_URL" ] && [ "$TAR_URL" != "null" ]; then
            echo "CLI Tarball indiriliyor: $TAR_URL"
            curl -fsSL -o package.tar.gz "$TAR_URL"
            tar -xf package.tar.gz -C ../bundle_cli/app/ --strip-components=1 2>/dev/null || tar -xf package.tar.gz -C ../bundle_cli/app/
          else
            echo "CLI npm'den derleniyor..."
            npm install -g --prefix "$GITHUB_WORKSPACE/bundle_cli/app" --omit=dev --no-audit --no-fund --ignore-engines "openclaw@${CLI_VERSION}"
            cd "$GITHUB_WORKSPACE/bundle_cli/app"
            [ -f bin/openclaw ] && ln -sf bin/openclaw openclaw
          fi
          cd "$GITHUB_WORKSPACE"

          mv bundle_cli "openclaw-cli-${CLI_VERSION}-x86_64"
          tar -czf "openclaw-cli-${CLI_VERSION}-x86_64.tar.gz" "openclaw-cli-${CLI_VERSION}-x86_64"
          rm -rf workdir_cli "openclaw-cli-${CLI_VERSION}-x86_64"

      - name: 4'lü SRPM Mimarisini Derle ve Copr'a Gönder
        run: |
          CLI_VER="${{ needs.check_update.outputs.cli_version }}"
          DESK_VER="${{ needs.check_update.outputs.desktop_version }}"
          RELEASE="1"

          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          # Depodaki özel logoyu SOURCES altına al
          if [ -f "assets/openclaw.png" ]; then
            cp assets/openclaw.png rpmbuild/SOURCES/openclaw.png
          elif [ -f "icon/256.png" ]; then
            cp icon/256.png rpmbuild/SOURCES/openclaw.png
          fi

          mv openclaw-desktop-${DESK_VER}-x86_64.tar.gz rpmbuild/SOURCES/ 2>/dev/null || true
          mv openclaw-cli-${CLI_VER}-x86_64.tar.gz rpmbuild/SOURCES/ 2>/dev/null || true

          cp specs/openclaw-desktop.spec rpmbuild/SPECS/
          cp specs/openclaw-cli.spec rpmbuild/SPECS/
          cp specs/openclaw-pwa-webui.spec rpmbuild/SPECS/
          cp specs/openclaw.spec rpmbuild/SPECS/

          sed -i "s/%{_version}/${DESK_VER}/g" rpmbuild/SPECS/openclaw-desktop.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw-desktop.spec

          sed -i "s/%{_version}/${CLI_VER}/g" rpmbuild/SPECS/openclaw-cli.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw-cli.spec

          sed -i "s/%{_version}/${CLI_VER}/g" rpmbuild/SPECS/openclaw-pwa-webui.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw-pwa-webui.spec

          sed -i "s/%{_version}/${CLI_VER}/g" rpmbuild/SPECS/openclaw.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw.spec

          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw-desktop.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw-cli.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw-pwa-webui.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw.spec

          copr-cli --config "$HOME/.config/copr" build --nowait "universish/OpenClaw.." rpmbuild/SRPMS/*.src.rpm

  # =========================================================================
  # 3. AŞAMA: YENİ SÜRÜM BİLGİSİNİ DEPOYA KAYDET (COMMIT & PUSH)
  # =========================================================================
  update_version_file:
    name: 3. Sürüm Kaydını Güncelle
    needs: [check_update, build_and_publish]
    if: needs.check_update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: latest-version.txt Dosyasını Güncelle ve Gönder
        run: |
          NEW_VER="${{ needs.check_update.outputs.combined_version }}"
          echo "$NEW_VER" > latest-version.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest-version.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump tracked version to ${NEW_VER} [skip ci]"
            git push
          else
            echo "Sürüm dosyasında değişiklik yok."
          fi
