name: Check Update and Build Copr RPM

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Manuel sürüme zorla (örn: 2026.9.8)'
        required: false
        default: ''

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --user root

    steps:
      - name: Gerekli Araçları ve Node.js Kur
        run: |
          dnf install -y \
            git curl jq rpm-build binutils tar xz zstd p7zip p7zip-plugins squashfs-tools copr-cli nodejs npm desktop-file-utils

      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copr Kimlik Bilgilerini Yapılandır
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p "$HOME/.config" /root/.config
          echo "$COPR_CONFIG" > "$HOME/.config/copr"
          echo "$COPR_CONFIG" > /root/.config/copr
          chmod 600 "$HOME/.config/copr" /root/.config/copr 2>/dev/null || true
          
      - name: Sürüm ve Paket Tipini Belirle
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REPO="openclaw/openclaw"
          AUTH_HEADER="Authorization: Bearer ${GH_TOKEN}"
          
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            TAG="v${{ github.event.inputs.force_version }}"
            RELEASE_JSON=$(curl -fsSL -H "$AUTH_HEADER" "https://api.github.com/repos/${UPSTREAM_REPO}/releases/tags/${TAG}" || true)
          else
            RELEASE_JSON=$(curl -fsSL -H "$AUTH_HEADER" "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" || true)
            TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              RELEASE_JSON=$(curl -fsSL -H "$AUTH_HEADER" "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=1" | jq '.[0]' || true)
              TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
            fi
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Upstream üzerinde geçerli bir release bulunamadı."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "Hedef Sürüm: $VERSION"

          LAST_BUILD=""
          [ -f latest-version.txt ] && LAST_BUILD=$(cat latest-version.txt)

          if [ -z "${{ github.event.inputs.force_version }}" ] && [ "$LAST_BUILD" = "$VERSION" ]; then
            echo "Bu sürüm ($VERSION) zaten paketlendi. İşlem atlanıyor."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 1. Öncelik: .AppImage (Asıl GUI uygulaması buradadır)
          APPIMAGE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test(".*\\.AppImage$"; "i")) | .browser_download_url' | head -n 1)
          # 2. Öncelik: .deb (Yalnızca AppImage yoksa)
          DEB_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test(".*\\.deb$"; "i")) | .browser_download_url' | head -n 1)

          if [ -n "$APPIMAGE_URL" ] && [ "$APPIMAGE_URL" != "null" ]; then
            echo "Paket tipi: .AppImage bulundu -> $APPIMAGE_URL"
            echo "download_url=$APPIMAGE_URL" >> $GITHUB_OUTPUT
            echo "pkg_type=appimage" >> $GITHUB_OUTPUT
          elif [ -n "$DEB_URL" ] && [ "$DEB_URL" != "null" ]; then
            echo "Paket tipi: .deb bulundu -> $DEB_URL"
            echo "download_url=$DEB_URL" >> $GITHUB_OUTPUT
            echo "pkg_type=deb" >> $GITHUB_OUTPUT
          else
            echo "GitHub üzerinde prebuilt bulunamadı. npm kontrol ediliyor..."
            NPM_VER=$(npm view "openclaw@${VERSION}" version 2>/dev/null || npm view openclaw version 2>/dev/null || true)
            if [ -n "$NPM_VER" ]; then
              echo "Paket tipi: npm bulundu -> openclaw@$NPM_VER"
              echo "pkg_type=npm" >> $GITHUB_OUTPUT
              VERSION="$NPM_VER"
            else
              echo "HATA: Hiçbir paket bulunamadı."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Node.js 24 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Paketi Çıkar, Demetle ve Arşivle
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          PKG_TYPE="${{ steps.check.outputs.pkg_type }}"
          URL="${{ steps.check.outputs.download_url }}"
          
          mkdir -p workdir app_extracted bundle/app
          cd workdir

          if [ "$PKG_TYPE" = "deb" ]; then
            echo ".deb paketi açılıyor: $URL"
            curl -fsSL -o package.deb "$URL"
            ar x package.deb
            tar -xf data.tar.* -C ../app_extracted/
            cd ../app_extracted
            
            echo "Açılan paket içeriği taranıyor..."
            # 1. opt altında herhangi bir klasör var mı? (Adı ne olursa olsun al)
            OPT_DIR=$(find opt -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
            if [ -n "$OPT_DIR" ]; then
              echo "opt altında uygulama dizini bulundu: $OPT_DIR"
              cp -a "$OPT_DIR"/* ../bundle/app/
            # 2. usr/share veya usr/lib altında openclaw klasörü var mı?
            elif find usr/share usr/lib -maxdepth 1 -type d -iname "*openclaw*" 2>/dev/null | grep -q .; then
              APP_DIR=$(find usr/share usr/lib -maxdepth 1 -type d -iname "*openclaw*" 2>/dev/null | head -n 1)
              echo "usr altında uygulama dizini bulundu: $APP_DIR"
              cp -a "$APP_DIR"/* ../bundle/app/
            # 3. Klasörsüz doğrudan usr/ altına mı dağıtılmış?
            elif [ -d usr/bin ]; then
              echo "Doğrudan /usr hiyerarşisi bulundu."
              cp -a usr/* ../bundle/app/
            else
              echo "Özel yapı algılanamadı, tüm içerik aktarılıyor."
              cp -a * ../bundle/app/
            fi

            # Simgeyi bul ve aktar
            ICON_SRC=$(find . -name "*openclaw*.png" -o -name "*OpenClaw*.png" -o -name "*.png" | head -n 1 || true)
            [ -n "$ICON_SRC" ] && cp -a "$ICON_SRC" ../bundle/app/openclaw.png || true

          elif [ "$PKG_TYPE" = "appimage" ]; then
            echo ".AppImage paketi açılıyor: $URL"
            curl -fsSL -o package.AppImage "$URL"
            
            # Doğrudan unsquashfs ile sembolik bağları ve izinleri koruyarak aç
            unsquashfs -d ../app_extracted package.AppImage || 7z x package.AppImage -o../app_extracted/ > /dev/null
            cd ../app_extracted
            
            # Sadece gereksiz .DirIcon kaldırılır, AppRun korunur
            rm -f .DirIcon 2>/dev/null || true
            cp -a * ../bundle/app/
            
            # İkili dosyaların çalıştırma izinlerini ver
            find ../bundle/app/ -type f \( -name "AppRun*" -o -name "*openclaw*" -o -name "*OpenClaw*" \) -exec chmod +x {} + 2>/dev/null || true
                        
            MAIN_BIN=$(find ../bundle/app/ -maxdepth 1 -type f -iname "openclaw" | head -n 1)
            [ -n "$MAIN_BIN" ] && chmod +x "$MAIN_BIN" || true

            ICON_SRC=$(find . -maxdepth 1 -name "*.png" | head -n 1 || true)
            [ -n "$ICON_SRC" ] && cp -a "$ICON_SRC" ../bundle/app/openclaw.png || true

          elif [ "$PKG_TYPE" = "npm" ]; then
            echo "npm paketi demetleniyor..."
            npm install -g --prefix "$GITHUB_WORKSPACE/bundle/app" --omit=dev --no-audit --no-fund "openclaw@${VERSION}"
            cd "$GITHUB_WORKSPACE/bundle/app"
            if [ -f bin/openclaw ]; then
              ln -sf bin/openclaw openclaw
            fi
          fi

          # GÜVENLİK KONTROLÜ: bundle/app boş kaldıysa Copr'a bozuk paket gönderme
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/bundle/app" 2>/dev/null)" ]; then
            echo "HATA: bundle/app dizinine hiçbir dosya kopyalanamadı!"
            echo "app_extracted içinde bulunan tüm dosyalar:"
            cd "$GITHUB_WORKSPACE/app_extracted" && find . -maxdepth 3
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          
          # openclaw ikilisinin çalıştırılabilir olduğundan emin ol
          find bundle/app/ -type f -iname "openclaw" -exec chmod +x {} + 2>/dev/null || true

          # Arşiv kök dizinini hazırla: openclaw-<VERSION>-x86_64
          mv bundle "openclaw-${VERSION}-x86_64"
          tar -czf "openclaw-${VERSION}-x86_64.tar.gz" "openclaw-${VERSION}-x86_64"
          rm -rf workdir app_extracted "openclaw-${VERSION}-x86_64"
          
      - name: SRPM Oluştur ve Copr'a Gönder
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mv "openclaw-${VERSION}-x86_64.tar.gz" rpmbuild/SOURCES/
          
          # specs/ altındaki spec dosyasını kopyala
          if [ -f specs/openclaw.spec ]; then
            cp specs/openclaw.spec rpmbuild/SPECS/openclaw.spec
          elif [ -f openclaw.spec ]; then
            cp openclaw.spec rpmbuild/SPECS/openclaw.spec
          fi

          # Sürümü spec dosyasının içine kalıcı olarak yaz (Mock unexpanded macro hatasını çözer)
          sed -i "s/%{_version}/${VERSION}/g" rpmbuild/SPECS/openclaw.spec

          # SRPM paketini oluştur
          rpmbuild -bs \
            --define "_topdir $PWD/rpmbuild" \
            rpmbuild/SPECS/openclaw.spec

          SRPM_FILE=$(ls rpmbuild/SRPMS/openclaw-*.src.rpm)
          echo "Oluşturulan SRPM: $SRPM_FILE"

          copr-cli --config "$HOME/.config/copr" build --nowait "universish/OpenClaw.." "$SRPM_FILE"
          
      - name: Sürümü Güncelle ve Değişiklikleri Kaydet
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "$VERSION" > latest-version.txt

          # Konteyner içi dosya sahipliği uyarısını aş
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-version.txt
          git commit -m "chore: release ${VERSION} build triggered on Copr" || exit 0
          git push
          
