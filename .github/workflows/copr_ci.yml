name: Check Update and Build Copr RPM

on:
  schedule:
    # OpenClaw merkezi (ABD Pasifik Saati - PT) öğle arası (~12:30) ve iş çıkışı (~17:30)
    - cron: '30 19 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Zorlanacak Sürüm (Örn: 2026.9.6 - Boş bırakılırsa güncel sürümü çeker)'
        required: false
        type: string
      force_release:
        description: 'Zorlanacak Paket Numarası (Örn: 2 - Boş bırakılırsa yeni sürümde 1 olur, aynı sürümde +1 artar)'
        required: false
        type: string
      rebuild_same_version:
        description: 'Yeni sürüm olmasa bile mevcut sürümü (+1 paket numarasıyla) yeniden paketle'
        required: false
        default: false
        type: boolean

# Peş peşe çoklu tetiklemelerde git push çakışmasını (race condition) ön하기 için kuyruk sistemi
concurrency:
  group: copr-packaging-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. AŞAMA: GÜNCEL SÜRÜMÜN YAYINLANIP YAYINLANMADIĞINI KONTROL ET
  # =========================================================================
  check_update:
    name: 1. Yeni Sürüm Kontrolü
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      cli_version: ${{ steps.check.outputs.cli_version }}
      desktop_version: ${{ steps.check.outputs.desktop_version }}
      pkg_release: ${{ steps.check.outputs.pkg_release }}
      state_record: ${{ steps.check.outputs.state_record }}
      should_update_file: ${{ steps.check.outputs.should_update_file }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js 24 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sürümleri ve Paket Numarasını (Release) Hesapla
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_VER="${{ github.event.inputs.force_version }}"
          FORCE_REL="${{ github.event.inputs.force_release }}"
          REBUILD_SAME="${{ github.event.inputs.rebuild_same_version }}"
          REPO="openclaw/openclaw"

          # HTTP 403 Rate Limit hatasını önlemek için GITHUB_TOKEN ile kimlik doğrulamalı API çağrısı
          RELEASES_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases?per_page=100")

          if [ -n "$FORCE_VER" ]; then
            CLI_VERSION="$FORCE_VER"
            DESKTOP_VERSION="$FORCE_VER"
          else
            DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.(AppImage|deb)$"; "i")))] | .[0]')
            DESKTOP_VERSION=$(echo "$DESKTOP_RELEASE" | jq -r .tag_name | sed 's/^v//')

            CLI_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.tar\\.(gz|xz)$"; "i")))] | .[0]')
            CLI_VERSION=$(echo "$CLI_RELEASE" | jq -r .tag_name | sed 's/^v//')

            if [ "$CLI_VERSION" == "null" ] || [ -z "$CLI_VERSION" ]; then
              CLI_VERSION=$(npm view openclaw version 2>/dev/null)
            fi
            if [ "$DESKTOP_VERSION" == "null" ] || [ -z "$DESKTOP_VERSION" ]; then
              DESKTOP_VERSION="$CLI_VERSION"
            fi
          fi

          # Depodaki mevcut kaydı oku (Format: SÜRÜM-PAKET_NO veya sadece SÜRÜM)
          RAW_RECORD=""
          if [ -f "latest-version.txt" ]; then
            RAW_RECORD=$(head -n 1 latest-version.txt | tr -d '[:space:]')
          fi

          if [[ "$RAW_RECORD" == *-* ]]; then
            SAVED_VER="${RAW_RECORD%-*}"
            SAVED_REL="${RAW_RECORD##*-}"
          else
            SAVED_VER="$RAW_RECORD"
            SAVED_REL="1"
          fi

          if ! [[ "$SAVED_REL" =~ ^[0-9]+$ ]]; then
            SAVED_REL="1"
          fi

          echo "Tespit Edilen Hedef Sürüm : $CLI_VERSION (Desktop: $DESKTOP_VERSION)"
          echo "Depodaki Kayıtlı Sürüm    : $SAVED_VER (Son Paket No: $SAVED_REL)"

          SHOULD_UPDATE_FILE="true"

          # Sürüm ve Paket Numarası (Release) Mantığı
          if [ "$CLI_VERSION" != "$SAVED_VER" ]; then
            HAS_UPDATE="true"
            PKG_RELEASE="1"
            # Eğer manuel olarak eski bir sürüm derleniyorsa (Örn: 2026.9.6 < 2026.10.5),
            # paket derlensin ama latest-version.txt dosyası eski sürüme düşürülmesin.
            if [ -n "$SAVED_VER" ]; then
              HIGHEST_VER=$(printf "%s\n%s\n" "$SAVED_VER" "$CLI_VERSION" | sort -V | tail -n 1)
              if [ "$HIGHEST_VER" != "$CLI_VERSION" ]; then
                SHOULD_UPDATE_FILE="false"
                echo "Bilgi: Geçmiş bir sürüm ($CLI_VERSION) derleniyor. latest-version.txt ($SAVED_VER) korunacak."
              fi
            fi
          elif [ -n "$FORCE_VER" ] || [ -n "$FORCE_REL" ] || [ "$REBUILD_SAME" == "true" ]; then
            HAS_UPDATE="true"
            PKG_RELEASE=$((SAVED_REL + 1))
            echo "Aynı sürüm üzerinde yeniden paketleme istendi. Paket numarası artırıldı: ${CLI_VERSION}-${PKG_RELEASE}"
          else
            HAS_UPDATE="false"
            PKG_RELEASE="$SAVED_REL"
            SHOULD_UPDATE_FILE="false"
            echo "Yeni güncelleme yok (${CLI_VERSION}-${SAVED_REL}). İş akışı sonlandırılıyor."
          fi

          if [ -n "$FORCE_REL" ]; then
            PKG_RELEASE="$FORCE_REL"
          fi

          STATE_RECORD="${CLI_VERSION}-${PKG_RELEASE}"

          echo "has_update=$HAS_UPDATE" >> $GITHUB_OUTPUT
          echo "cli_version=$CLI_VERSION" >> $GITHUB_OUTPUT
          echo "desktop_version=$DESKTOP_VERSION" >> $GITHUB_OUTPUT
          echo "pkg_release=$PKG_RELEASE" >> $GITHUB_OUTPUT
          echo "state_record=$STATE_RECORD" >> $GITHUB_OUTPUT
          echo "should_update_file=$SHOULD_UPDATE_FILE" >> $GITHUB_OUTPUT

  # =========================================================================
  # 2. AŞAMA: İNDİR, AÇ, SPEC İLE PAKETLE VE 11 DAĞITIM İÇİN COPR'A GÖNDER
  # =========================================================================
  build_and_publish:
    name: 2. Paketleme ve Copr Yayınlama
    needs: check_update
    if: needs.check_update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js 24 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl rpm squashfs-tools p7zip-full binutils python3-pip
          sudo pip3 install --break-system-packages copr-cli 2>/dev/null || sudo pip3 install copr-cli

      - name: Copr CLI Yapılandır
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr
          if [ ! -s ~/.config/copr ] || ! grep -q "token" ~/.config/copr; then
            echo "HATA: COPR_CONFIG secret'ı boş veya eksik!" >&2
            exit 1
          fi

      - name: Kaynak Paketleri İndir ve Hazırla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLI_VERSION="${{ needs.check_update.outputs.cli_version }}"
          DESKTOP_VERSION="${{ needs.check_update.outputs.desktop_version }}"
          FORCE_VER="${{ github.event.inputs.force_version }}"
          REPO="openclaw/openclaw"

          # HTTP 403 hatasını önlemek için GITHUB_TOKEN ile kimlik doğrulamalı sorgu
          RELEASES_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases?per_page=100")

          if [ -n "$FORCE_VER" ]; then
            # Önce doğrudan etiket (tag) üzerinden sorgula (Eski sürümler 100'lük listede olmasa bile bulur)
            TAG_JSON=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/tags/v${FORCE_VER}" 2>/dev/null || echo "")

            if [ -n "$TAG_JSON" ] && [ "$(echo "$TAG_JSON" | jq -r '.tag_name // empty')" == "v${FORCE_VER}" ]; then
              DESKTOP_RELEASE="$TAG_JSON"
              CLI_RELEASE="$TAG_JSON"
            else
              DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c --arg v "v$FORCE_VER" '.[] | select(.tag_name == $v)' | head -n 1)
              CLI_RELEASE="$DESKTOP_RELEASE"
            fi

            # Eğer o sürümde masaüstü ikilisi (.AppImage/.deb) yayınlanmamışsa en yakın masaüstü sürümünü kullan
            HAS_DESK_ASSET=$(echo "$DESKTOP_RELEASE" | jq -r '[.assets[]? | select(.name | test("\\.(AppImage|deb)$"; "i"))] | length' 2>/dev/null || echo "0")
            if [ -z "$DESKTOP_RELEASE" ] || [ "$DESKTOP_RELEASE" == "null" ] || [ "$HAS_DESK_ASSET" == "0" ]; then
              DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.(AppImage|deb)$"; "i")))] | .[0]')
            fi
          else
            DESKTOP_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.(AppImage|deb)$"; "i")))] | .[0]')
            CLI_RELEASE=$(echo "$RELEASES_JSON" | jq -c '[.[] | select(.assets != null and (.assets | length > 0)) | select(any(.assets[]; .name | test("\\.tar\\.(gz|xz)$"; "i")))] | .[0]')
          fi

          APPIMAGE_URL=$(echo "$DESKTOP_RELEASE" | jq -r '.assets[]? | select(.name | test("\\.AppImage$"; "i")) | .browser_download_url' | head -n 1)
          DEB_URL=$(echo "$DESKTOP_RELEASE" | jq -r '.assets[]? | select(.name | test("\\.deb$"; "i")) | .browser_download_url' | head -n 1)
          TAR_URL=$(echo "$CLI_RELEASE" | jq -r '.assets[]? | select(.name | test("\\.tar\\.(gz|xz)$"; "i")) | .browser_download_url' | head -n 1)

          # --- 1. DESKTOP HAZIRLIĞI ---
          mkdir -p workdir_desktop bundle_desktop/app app_extracted
          cd workdir_desktop
          if [ -n "$APPIMAGE_URL" ] && [ "$APPIMAGE_URL" != "null" ]; then
            echo "Desktop AppImage indiriliyor: $APPIMAGE_URL"
            curl -fsSL --retry 3 -o package.AppImage "$APPIMAGE_URL"
            chmod +x package.AppImage
            ./package.AppImage --appimage-extract
            cp -a squashfs-root/* ../bundle_desktop/app/
          elif [ -n "$DEB_URL" ] && [ "$DEB_URL" != "null" ]; then
            echo "Desktop deb indiriliyor: $DEB_URL"
            curl -fsSL --retry 3 -o package.deb "$DEB_URL"
            ar x package.deb
            tar -xf data.tar.* -C ../app_extracted/
            OPT_DIR=$(find ../app_extracted/opt -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
            [ -n "$OPT_DIR" ] && cp -a "$OPT_DIR"/* ../bundle_desktop/app/ || cp -a ../app_extracted/* ../bundle_desktop/app/
          fi
          cd ..

          # İkon garantisi
          ICON_FOUND=$(find bundle_desktop/app/ -maxdepth 3 -type f \( -iname "*openclaw*.png" -o -iname "*OpenClaw*.png" \) 2>/dev/null | head -n 1)
          if [ -z "$ICON_FOUND" ]; then
            if [ -f "icon/256.png" ]; then
              cp -a icon/256.png bundle_desktop/app/openclaw.png
            else
              curl -fsSL -o bundle_desktop/app/openclaw.png "https://raw.githubusercontent.com/openclaw/openclaw/main/assets/icon.png" 2>/dev/null || true
            fi
          else
            cp -a "$ICON_FOUND" bundle_desktop/app/openclaw.png
          fi

          mv bundle_desktop "openclaw-desktop-${DESKTOP_VERSION}-x86_64"
          tar -czf "openclaw-desktop-${DESKTOP_VERSION}-x86_64.tar.gz" "openclaw-desktop-${DESKTOP_VERSION}-x86_64"
          rm -rf workdir_desktop app_extracted "openclaw-desktop-${DESKTOP_VERSION}-x86_64"

          # --- 2. CLI HAZIRLIĞI ---
          mkdir -p workdir_cli bundle_cli/app
          cd workdir_cli
          if [ -n "$TAR_URL" ] && [ "$TAR_URL" != "null" ]; then
            echo "CLI Tarball indiriliyor: $TAR_URL"
            curl -fsSL --retry 3 -o package.tar.gz "$TAR_URL"
            tar -xf package.tar.gz -C ../bundle_cli/app/ --strip-components=1 2>/dev/null || tar -xf package.tar.gz -C ../bundle_cli/app/
          else
            echo "CLI npm'den derleniyor..."
            npm install -g --prefix "$GITHUB_WORKSPACE/bundle_cli/app" --omit=dev --no-audit --no-fund --ignore-engines "openclaw@${CLI_VERSION}"
            cd "$GITHUB_WORKSPACE/bundle_cli/app"
            [ -f bin/openclaw ] && ln -sf bin/openclaw openclaw
          fi
          cd "$GITHUB_WORKSPACE"

          mv bundle_cli "openclaw-cli-${CLI_VERSION}-x86_64"
          tar -czf "openclaw-cli-${CLI_VERSION}-x86_64.tar.gz" "openclaw-cli-${CLI_VERSION}-x86_64"
          rm -rf workdir_cli "openclaw-cli-${CLI_VERSION}-x86_64"

      - name: 4'lü SRPM Mimarisini Derle ve 11 Chroot İçin Copr'a Gönder
        run: |
          CLI_VER="${{ needs.check_update.outputs.cli_version }}"
          DESK_VER="${{ needs.check_update.outputs.desktop_version }}"
          RELEASE="${{ needs.check_update.outputs.pkg_release }}"
          COPR_REPO="universish/OpenClaw.."

          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          if [ -f "assets/openclaw.png" ]; then
            cp assets/openclaw.png rpmbuild/SOURCES/openclaw.png
          elif [ -f "icon/256.png" ]; then
            cp icon/256.png rpmbuild/SOURCES/openclaw.png
          fi

          mv openclaw-desktop-${DESK_VER}-x86_64.tar.gz rpmbuild/SOURCES/ 2>/dev/null || true
          mv openclaw-cli-${CLI_VER}-x86_64.tar.gz rpmbuild/SOURCES/ 2>/dev/null || true

          cp specs/openclaw-desktop.spec rpmbuild/SPECS/
          cp specs/openclaw-cli.spec rpmbuild/SPECS/
          cp specs/openclaw-pwa-webui.spec rpmbuild/SPECS/
          cp specs/openclaw.spec rpmbuild/SPECS/

          sed -i "s/%{_version}/${DESK_VER}/g" rpmbuild/SPECS/openclaw-desktop.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw-desktop.spec

          sed -i "s/%{_version}/${CLI_VER}/g" rpmbuild/SPECS/openclaw-cli.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw-cli.spec

          sed -i "s/%{_version}/${CLI_VER}/g" rpmbuild/SPECS/openclaw-pwa-webui.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw-pwa-webui.spec

          sed -i "s/%{_version}/${CLI_VER}/g" rpmbuild/SPECS/openclaw.spec
          sed -i "s/%{_release}/${RELEASE}/g" rpmbuild/SPECS/openclaw.spec

          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw-desktop.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw-cli.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw-pwa-webui.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/openclaw.spec

          CHROOTS=(
            "almalinux-10-x86_64_v2"
            "almalinux-9-x86_64"
            "almalinux-kitten-10-x86_64"
            "almalinux-kitten-10-x86_64_v2"
            "centos-stream-10-x86_64"
            "centos-stream-9-x86_64"
            "fedora-44-x86_64"
            "fedora-45-x86_64"
            "fedora-rawhide-x86_64"
            "opensuse-leap-16.0-x86_64"
            "opensuse-tumbleweed-x86_64"
          )

          CHROOT_ARGS=()
          for ch in "${CHROOTS[@]}"; do
            CHROOT_ARGS+=("--chroot" "$ch")
          done

          echo "Copr projesinde hedef dağıtımlar etkinleştiriliyor..."
          copr-cli --config "$HOME/.config/copr" modify "${CHROOT_ARGS[@]}" "$COPR_REPO" || true

          for srpm in rpmbuild/SRPMS/*.src.rpm; do
            echo "Copr'a gönderiliyor: $srpm (Sürüm: ${CLI_VER}-${RELEASE})"
            copr-cli --config "$HOME/.config/copr" build --nowait "${CHROOT_ARGS[@]}" "$COPR_REPO" "$srpm" || \
            copr-cli --config "$HOME/.config/copr" build --nowait "$COPR_REPO" "$srpm"
          done

  # =========================================================================
  # 3. AŞAMA: YENİ SÜRÜM VE PAKET NUMARASINI DEPOYA KAYDET (COMMIT & PUSH)
  # =========================================================================
  update_version_file:
    name: 3. Sürüm Kaydını Güncelle
    needs: [check_update, build_and_publish]
    if: needs.check_update.outputs.has_update == 'true' && needs.check_update.outputs.should_update_file == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: latest-version.txt Dosyasını Çakışmasız Güncelle ve Gönder
        run: |
          NEW_STATE="${{ needs.check_update.outputs.state_record }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Uzak depoda başka bir commit varsa çekip çakışmayı önle (Retry döngüsü)
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            echo "$NEW_STATE" > latest-version.txt
            git add latest-version.txt

            if git diff --staged --quiet; then
              echo "Sürüm dosyası zaten ${NEW_STATE} olarak güncel."
              break
            fi

            git commit -m "chore: bump tracked build to ${NEW_STATE} [skip ci]"
            if git push origin HEAD:main; then
              echo "Başarıyla güncellendi: ${NEW_STATE}"
              break
            else
              echo "Push çakışması yaşandı, tekrar deneniyor ($attempt/3)..."
              sleep 2
            fi
          done
